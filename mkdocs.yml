site_name: Open LLM Safety Evaluation
site_description: Open-source framework for stress-testing AI systems across bias, toxicity, truthfulness, robustness, and adversarial risk dimensions.
site_url: https://felipelago17.github.io/Responsible-AI-evaluation/
repo_url: https://github.com/felipelago17/Responsible-AI-evaluation
repo_name: felipelago17/Responsible-AI-evaluation

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Methodology:
    - Framework Overview: methodology.md
    - Five-Phase Assessment: methodology/five-phase-assessment.md
  - Benchmarks:
    - Bias: benchmarks/bias.md
    - Toxicity: benchmarks/toxicity.md
    - Truthfulness: benchmarks/truthfulness.md
    - Robustness:
      - Overview: benchmarks/robustness.md
      - Red Teaming: benchmarks/red-teaming.md
  - Scoring: scoring.md
  - Limitations: limitations.md
  - Threat Assessment:
    - Adversarial ML Taxonomy: threats/adversarial-ml-taxonomy.md
  - Mappings:
    - 'ATLAS × AI RMF Matrix': mappings/atlas-airmf-matrix.md
  - Evaluation:
    - Test Catalogue: evaluation/test-catalogue.md
    - 'Metrics & KPIs': evaluation/metrics.md
  - Criteria:
    - Deployment Readiness: criteria/deployment-readiness.md
  - Supply Chain:
    - AI Bill of Materials: supply-chain/ai-bom.md
  - Governance:
    - Overview: governance.md
    - Release Governance: governance/release-governance.md
    - Governance Mapping: governance_mapping.md
  - UNESCO EIA:
    - Overview: eia/index.md
    - How to Run: eia/how-to-run.md
    - 'Part 1 — Scoping': eia/scoping.md
    - 'Part 2 — Principles & Safeguards': eia/principles.md
    - 'Part 3 — Impact Mapping': eia/impact-mapping.md
    - Principles Reference: eia/principles-reference.md
    - Regulatory Crosswalk: eia/crosswalk.md
  - Literature:
    - 'Bias & Fairness': literature/bias-and-fairness.md
    - Toxicity: literature/toxicity.md
    - Truthfulness: literature/truthfulness.md
    - Red Teaming: literature/red-teaming.md
    - Adversarial Attacks: literature/adversarial-attacks.md
    - Governance Frameworks: literature/ai-governance-frameworks.md
    - Governance Mapping: literature/governance-mapping.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/framework-animations.css

extra_javascript:
  - assets/javascripts/framework-animations.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
