name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Lint Markdown
        run: markdownlint 'docs/**/*.md' 'eia/templates/**/*.md' --ignore 'docs/literature/**' --config .markdownlint.json || true
        # || true so lint warnings don't break CI until config is tuned

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-loopback docs/**/*.md eia/**/*.md
          fail: false
        # fail: false during initial rollout; set to true once all external links are verified
