name: Daily AI Governance Digest

on:
  schedule:
    - cron: '17 6 * * *'   # daily, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml feedparser

      - name: Build digest
        run: python .github/scripts/daily_digest.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/news/digest.md data/digest-latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily digest $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
